<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROBOT FPV</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#0f0;}
    #cam-container{
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      width:92vw;height:88vh;padding:16px;background:#000;
      border:8px solid #0f0;border-radius:20px;
      box-shadow:0 0 40px #0f0, inset 0 0 40px #0f0;z-index:1;
    }
    #cam{width:100%;height:100%;object-fit:contain;background:#000;image-rendering:pixelated;display:block;}
    .ui{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none;padding:10px;}
    .ui > *{pointer-events:auto;}
    .top{
      display:flex;flex-direction:column;align-items:center;gap:8px;
      background:rgba(0,0,0,0.75);border-radius:14px;
      padding:10px 20px;margin:8px auto 0;width:fit-content;
      border:2px solid rgba(0,255,0,0.5);
    }
    .title{font-size:20px;letter-spacing:6px;text-shadow:0 0 18px #0f0;}
    .speed{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:15px;}
    .speed label{letter-spacing:3px;}
    .speed-controls{display:flex;gap:12px;align-items:center;}
    input[type=number]{
      width:52px;padding:5px;font-size:17px;background:#000;border:2px solid #0f0;
      color:#0f0;border-radius:8px;text-align:center;
    }
    input[type=range]{
      width:140px;height:9px;background:#111;border-radius:5px;-webkit-appearance:none;
    }
    input[type=range]::-webkit-slider-thumb{
      background:#0f0;width:26px;height:26px;border-radius:50%;box-shadow:0 0 20px #0f0;
    }
    #lightBtn{
      margin-top:6px;padding:8px 26px;font-size:18px;
      border:4px solid #0f0;background:rgba(0,0,0,0.8);border-radius:14px;
      box-shadow:0 0 20px rgba(0,255,0,0.6);cursor:pointer;transition:all .3s;
    }
    #lightBtn.on{background:#0f0;color:#000;box-shadow:0 0 50px #0f0;}
    .wasd{
      position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
      display:grid;
      grid-template-columns:repeat(3,62px);
      grid-template-rows:repeat(3,62px);
      gap:11px;background:rgba(0,0,0,0.85);
      padding:12px 16px;border-radius:18px;
      border:3px solid rgba(0,255,0,0.5);
    }
    .btn{
      background:rgba(0,0,0,0.9);border:4px solid #0f0;border-radius:50%;
      color:#0f0;font-size:38px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;user-select:none;transition:all .1s;
      box-shadow:0 0 15px rgba(0,255,0,0.6);
    }
    .btn:active{background:#0f0;color:#000;transform:scale(0.88);box-shadow:0 0 50px #0f0;}
    #stop{background:rgba(100,0,0,0.95);border-color:#f00;color:#f00;}
    #stop:active{background:#f00;color:#fff;}
    .status{
      position:fixed;top:10px;right:10px;padding:6px 14px;
      background:rgba(0,255,0,0.2);border:2px solid #0f0;
      border-radius:10px;font-size:14px;backdrop-filter:blur(5px);
    }
    @media (max-width:768px){
      .wasd{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:9px;padding:10px;}
      .btn{font-size:34px;}
    }
  </style>
</head>
<body>
  <div id="cam-container"><img id="cam" src="/stream" alt="FPV"></div>
  <div class="ui">
    <div class="top">
      <div class="title">ROBOT FPV</div>
      <div class="speed">
        <label>SPEED</label>
        <div class="speed-controls">
          <input type="number" id="speedVal" value="13" min="5" max="13" onchange="setSpeed(this.value)">
          <input type="range" min="5" max="13" value="13" step="1" oninput="setSpeed(this.value)">
        </div>
      </div>
      <div id="lightBtn" onclick="toggleLight()">LIGHT OFF</div>
    </div>
    <div class="wasd">
      <div></div>
      <button class="btn" data-cmd="w">↑</button>
      <div></div>
      <button class="btn" data-cmd="a">←</button>
      <button class="btn" id="stop"></button>
      <button class="btn" data-cmd="d">→</button>
      <div></div>
      <button class="btn" data-cmd="s">↓</button>
      <div></div>
    </div>
  </div>
  <div class="status" id="status">LIVE</div>

  <script>
  const MOTOR = '/c?d=';
  const SPEED_URL = '/c?d=s';
  let interval = null;
  let lightOn = false;

  function send(cmd) { fetch(MOTOR + cmd, {mode: 'no-cors'}).catch(() => {}); }

  function setSpeed(v) {
    v = Math.max(5, Math.min(13, parseInt(v || 13)));
    document.getElementById('speedVal').value = v;
    document.querySelector('input[type=range]').value = v;
    fetch(SPEED_URL + v, {mode: 'no-cors'});
  }

  function toggleLight() {
    lightOn = !lightOn;
    const b = document.getElementById('lightBtn');
    b.textContent = lightOn ? 'LIGHT ON' : 'LIGHT OFF';
    b.classList.toggle('on', lightOn);
    send('l');
  }

  // SINGLE SOURCE OF TRUTH — one command per press, continuous only while held
  function startCommand(cmd) {
    // If we're already sending this exact command, do nothing (prevents double-fire)
    if (interval && interval._cmd === cmd) return;

    clearInterval(interval);
    send(cmd);  // send once immediately
    interval = setInterval(() => send(cmd), 200);  // 5 commands/sec = smooth + ngrok-safe
    interval._cmd = cmd;  // mark which command is active
  }

  function stopCommand() {
    clearInterval(interval);
    interval = null;
    send('x');  // immediate stop
  }

  // Apply to ALL buttons (mouse + touch)
  document.querySelectorAll('.btn[data-cmd]').forEach(btn => {
    const cmd = btn.dataset.cmd;

    const press = (e) => { e.preventDefault(); startCommand(cmd); };
    const release = () => stopCommand();

    // Mouse
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);

    // Touch
    btn.addEventListener('touchstart', press);
    btn.addEventListener('touchend', release);
    btn.addEventListener('touchcancel', release);
  });

  // Keyboard — WASD + Arrows (perfect stop on release)
  const keyMap = {KeyW:'w', KeyA:'a', KeyS:'s', KeyD:'d', ArrowUp:'w', ArrowLeft:'a', ArrowDown:'s', ArrowRight:'d'};
  document.addEventListener('keydown', e => {
    const cmd = keyMap[e.code];
    if (cmd && !e.repeat) {  // e.repeat = true if key is held (prevents spam on long press)
      e.preventDefault();
      startCommand(cmd);
    }
  });

  document.addEventListener('keyup', e => {
    if (keyMap[e.code]) {
      e.preventDefault();
      stopCommand();
    }
  });

  // Emergency stop (double-tap center button)
  let taps = 0;
  document.getElementById('stop').addEventListener('click', () => {
    taps++;
    if (taps === 2) {
      stopCommand();
      send('x'); send('x'); send('x');
      alert("EMERGENCY STOP!");
      taps = 0;
    }
    setTimeout(() => taps = 0, 500);
  });
</script>
</body>
</html>
