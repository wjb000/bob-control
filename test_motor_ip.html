<!DOCTYPE html>
<html>
<head>
<title>Find Motor ESP IP</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px;}
input{background:#111;color:#0f0;border:2px solid #0f0;padding:10px;font-size:16px;width:200px;}
button{background:#0f0;color:#000;border:none;padding:10px 20px;font-size:16px;cursor:pointer;margin:5px;}
.result{margin:10px 0;padding:10px;border:1px solid #0f0;}
</style>
</head>
<body>
<h2>🔍 Find Motor ESP32 IP</h2>
<p>Enter IP to test: <input type="text" id="ip" value="192.168.1." placeholder="192.168.1.XXX"></p>
<button onclick="testIP()">Test This IP</button>
<button onclick="scanRange()">Scan 192.168.1.1-254</button>
<div id="results"></div>

<script>
function testIP() {
  const ip = document.getElementById('ip').value;
  const results = document.getElementById('results');
  results.innerHTML += `<div class="result">Testing ${ip}...</div>`;

  fetch(`http://${ip}/c?d=w`, {mode:'no-cors', cache:'no-store'})
    .then(() => {
      results.innerHTML += `<div class="result" style="color:#0f0">✅ ${ip} RESPONDS!</div>`;
    })
    .catch(err => {
      results.innerHTML += `<div class="result" style="color:#f00">❌ ${ip} no response</div>`;
    });
}

function scanRange() {
  const results = document.getElementById('results');
  results.innerHTML = '<div class="result">Scanning 192.168.1.1-254...</div>';

  for(let i = 1; i <= 254; i++) {
    setTimeout(() => {
      const ip = `192.168.1.${i}`;
      fetch(`http://${ip}/c?d=x`, {mode:'no-cors', cache:'no-store', timeout:500})
        .then(() => {
          results.innerHTML += `<div class="result" style="color:#0f0">✅ Found: ${ip}</div>`;
        })
        .catch(() => {});
    }, i * 50);
  }
}
</script>
</body>
</html>
