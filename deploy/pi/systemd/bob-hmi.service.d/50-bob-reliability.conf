# bob-net (2026-11-03)
# - NetworkManager-wait-online is disabled for faster boot, so HMI waits for NM startup itself
#   (it enumerates LAN IPv4 for its :443/:80 listeners at start). '-' = never block HMI if it times out.
# - Higher CPU/IO priority than the perception stack so drive commands + serial writes are not starved.
[Unit]
After=NetworkManager.service
StartLimitIntervalSec=120
StartLimitBurst=10

[Service]
ExecStartPre=-/usr/bin/nm-online -s -q -t 30
Restart=always
RestartSec=2
Nice=-5
CPUWeight=400
IOWeight=400
